<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="女装、童装2026年全渠道销售目标与实际经营驾驶舱。"><title>销售全渠道｜总经理经营工作台</title>
  <style>
    :root{--ink:#17243b;--text:#26364f;--sub:#64748b;--line:#dce4ec;--teal:#14b8a6;--amber:#f59e0b;--paper:#f6f9fc}*{box-sizing:border-box}body{margin:0;color:var(--text);font:15px/1.5 "Microsoft YaHei UI","PingFang SC",Arial,sans-serif;background:radial-gradient(circle at 87% 0%,#ccfbf166,transparent 28rem),var(--paper)}button,select{font:inherit}.shell{width:min(1480px,100%);margin:auto;padding:24px 38px}.header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:10px 0 22px}.eyebrow{color:#526175;font-size:12px;font-weight:700;letter-spacing:.08em}.eyebrow i{display:inline-block;width:9px;height:9px;margin-right:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px #14b8a61f}.header h1{margin:9px 0 0;color:var(--ink);font-size:clamp(30px,3vw,42px);line-height:1.15;letter-spacing:-.045em}.header p{margin:6px 0 0;color:var(--sub)}.verified{border:1px solid #d7e1ea;border-radius:99px;background:#ffffffd9;padding:10px 14px;color:#34435a;font-size:13px;box-shadow:0 8px 24px #1e324a0f}.verified b{color:#0f766e}
    .filters{display:flex;align-items:center;gap:12px;margin-bottom:14px;border:1px solid var(--line);border-radius:15px;background:#ffffffdd;padding:10px 12px}.segments{display:flex;padding:3px;border-radius:11px;background:#e9eff5}.segments button{border:0;border-radius:8px;background:transparent;padding:7px 20px;color:#64748b;font-weight:700;cursor:pointer}.segments button.active{background:white;color:#0f766e;box-shadow:0 2px 8px #0f172a18}.filters label{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px}.filters select{border:1px solid #d7e1ea;border-radius:9px;background:white;padding:7px 10px;font-weight:700}.coverage{margin-left:auto;color:#64748b;font-size:12px}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric{min-height:137px;border:1px solid var(--line);border-radius:16px;background:#fffffff0;padding:18px 20px;box-shadow:0 8px 30px #1e324a0d}.metric.teal{border-top:3px solid var(--teal)}.metric.amber{border-top:3px solid var(--amber)}.metric label{display:block;color:var(--sub);font-size:13px;font-weight:650}.metric strong{display:block;margin-top:12px;color:var(--ink);font-size:clamp(25px,2.3vw,34px);letter-spacing:-.04em}.metric small{display:block;margin-top:7px;color:#748196;font-size:12px}.band{display:flex;align-items:center;gap:24px;margin-top:14px;border-radius:16px;background:var(--ink);padding:16px 20px;color:white;box-shadow:0 14px 35px #17243b26}.band-copy{min-width:215px}.band-copy small{display:block;color:#aab6c8}.band-copy b{font-size:22px}.track{height:10px;flex:1;overflow:hidden;border-radius:99px;background:#334155}.track i{display:block;height:100%;border-radius:inherit;background:var(--teal)}.shortfall{color:#fcd34d;font-size:13px;font-weight:650;white-space:nowrap}
    .panel{margin-top:14px;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fffffff5;box-shadow:0 8px 30px #1e324a0d}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #e5ebf1;padding:16px 20px}.panel-head h2{margin:0;color:var(--ink);font-size:16px}.panel-head p{margin:3px 0 0;color:#748196;font-size:12px}.legend{color:#748196;font-size:12px}.legend i{display:inline-block;width:8px;height:8px;margin:0 5px 0 10px;border-radius:2px}.legend .target{background:#334155}.legend .actual{background:var(--teal)}.chart{display:grid;grid-template-columns:repeat(12,minmax(44px,1fr));gap:6px;height:200px;padding:16px 20px 10px;overflow-x:auto}.month{display:grid;grid-template-rows:1fr auto;gap:7px;min-width:44px;border:0;border-radius:9px;background:transparent;padding:6px;cursor:pointer}.month:hover,.month.on{background:#f1f5f9}.month.on b{color:#0f766e}.bars{display:flex;align-items:flex-end;justify-content:center;gap:3px;min-height:130px}.bars i{display:block;width:9px;min-height:2px;border-radius:3px 3px 1px 1px}.bars .t{background:#334155}.bars .a{background:var(--teal)}.month b{color:#748196;font-size:11px}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{height:58px;padding:0 16px;border-bottom:1px solid #edf1f5;text-align:left;font-size:13px}th{height:44px;color:#66758a;font-size:12px}th.num,td.num{text-align:right}tr.data{cursor:pointer}tr.data:hover{background:#f8fafc}.channel{display:flex;align-items:center;gap:10px;min-width:250px}.channel>i{display:grid;width:30px;height:30px;place-items:center;border-radius:8px;background:#edf2f7;color:#526175;font-style:normal;font-weight:800}.channel b{display:block}.channel small{display:block;max-width:320px;overflow:hidden;color:#8490a1;font-size:10px;font-weight:400;text-overflow:ellipsis}.progress{display:flex;align-items:center;gap:12px}.mini{width:min(130px,12vw);height:8px;overflow:hidden;border-radius:99px;background:#e2e8f0}.mini i{display:block;height:100%;border-radius:inherit}.pct{width:52px;text-align:right;font-size:12px;font-weight:700}.badge{display:inline-flex;align-items:center;border:1px solid;border-radius:99px;padding:3px 8px;font-size:11px}.good{border-color:#99f6e4;background:#f0fdfa;color:#0f766e}.risk{border-color:#fde68a;background:#fffbeb;color:#a16207}.info{border-color:#bfdbfe;background:#eff6ff;color:#1d4ed8}.muted{border-color:#dce4ec;background:#f8fafc;color:#64748b}footer{display:flex;justify-content:space-between;gap:16px;padding:16px 3px;color:#748196;font-size:12px}
    dialog{width:min(540px,94vw);max-height:86vh;padding:0;border:0;border-radius:17px;color:var(--text);box-shadow:0 25px 80px #0f172a4d}dialog::backdrop{background:#0f172a33;backdrop-filter:blur(2px)}.close{position:absolute;right:14px;top:14px;width:34px;height:34px;border:0;border-radius:9px;background:#f1f5f9;cursor:pointer}.dialog-head{padding:22px 24px;border-bottom:1px solid #e5ebf1}.dialog-head h3{margin:0;color:var(--ink);font-size:21px}.dialog-head p{margin:4px 0 0;color:var(--sub);font-size:13px}.detail{padding:20px 24px 25px}.facts{margin:0 0 18px}.facts div,.sources div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #e5ebf1}.facts dt,.sources dt{color:#748196}.facts dd,.sources dd{margin:0;text-align:right;font-weight:700}.sources{border:1px solid var(--line);border-radius:14px;background:#fbfdff;padding:14px}.sources h4{margin:0;color:var(--ink)}.sources dl{margin:7px 0 0;font-size:11px}.sources dd{font-family:Consolas,monospace;font-size:10px;white-space:normal}.notice{margin-top:14px;border:1px solid #fde68a;border-radius:10px;background:#fffbeb;padding:10px;color:#92400e;font-size:12px}
    @media(max-width:900px){.metrics{grid-template-columns:1fr 1fr}.band{flex-wrap:wrap}.track{order:3;flex-basis:100%}}@media(max-width:620px){.shell{padding:16px 13px}.verified,.legend{display:none}.filters{flex-wrap:wrap}.coverage{width:100%;margin-left:0}.metric{min-height:122px;padding:14px}.metric strong{font-size:21px}.chart{grid-template-columns:repeat(12,48px)}footer{flex-direction:column}}
  </style>
</head>
<body><main class="shell"><header class="header"><div><div class="eyebrow"><i></i>总经理经营工作台 · V1</div><h1>销售全渠道</h1><p id="subtitle">加载数据中…</p></div><div class="verified">数据截至 <b>2026-07-31</b></div></header>
  <section class="filters"><div class="segments" id="brands"></div><label>月份<select id="month"></select></label><span class="coverage" id="coverage"></span></section>
  <section class="metrics"><article class="metric"><label>可比渠道目标</label><strong id="target">—</strong><small>仅汇总目标与实际覆盖一致的渠道</small></article><article class="metric teal"><label>可比渠道实际</label><strong id="actual">—</strong><small>截至 2026-07-31</small></article><article class="metric amber"><label>目标完成率</label><strong id="rate">—</strong><small id="gap">—</small></article><article class="metric"><label>达成渠道</label><strong id="achieved">—</strong><small>完成率 ≥ 100%</small></article></section>
  <section class="band"><div class="band-copy"><small>可比渠道整体进度</small><b id="band-rate">—</b></div><div class="track"><i id="band-bar"></i></div><div class="shortfall" id="band-gap">—</div></section>
  <section class="panel"><header class="panel-head"><div><h2>月度销售走势</h2><p>点击月份切换明细；深色为目标，绿色为实际。</p></div><div class="legend"><i class="target"></i>目标 <i class="actual"></i>实际</div></header><div class="chart" id="chart"></div></section>
  <section class="panel"><header class="panel-head"><div><h2>渠道完成情况</h2><p>9 个标准渠道完整展示，缺数与口径问题不隐藏。</p></div></header><div class="table-wrap"><table><thead><tr><th>渠道</th><th class="num">销售目标</th><th class="num">销售实际</th><th>完成进度</th><th class="num">目标差额</th><th class="num">数据状态</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  <footer><span>奥莱→直营；有赞、视频号→微信私域</span><span>加盟实际不以出货/回款替代 · 数据截至 2026-07-31</span></footer></main>
  <dialog id="detail"><button class="close">×</button><div class="dialog-head"><h3 id="d-title"></h3><p id="d-sub"></p></div><div class="detail"><dl class="facts"><div><dt>销售目标</dt><dd id="d-target"></dd></div><div><dt>销售实际</dt><dd id="d-actual"></dd></div><div><dt>目标完成率</dt><dd id="d-rate"></dd></div><div><dt>数据状态</dt><dd id="d-state"></dd></div></dl><section class="sources"><h4>原始数据来源</h4><dl id="d-sources"></dl></section><div class="notice" id="d-note"></div></div></dialog>
  <script>
    let DATA,brandId='WOMEN',month=7;const $=s=>document.querySelector(s),money=n=>n==null?'—':new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY',maximumFractionDigits:0}).format(n),compact=n=>new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY',notation:'compact',maximumFractionDigits:2}).format(n),pct=n=>n==null?'—':new Intl.NumberFormat('zh-CN',{style:'percent',maximumFractionDigits:1}).format(n);
    fetch('phase3-data.json').then(r=>r.json()).then(d=>{DATA=d;init()}).catch(()=>{$('#subtitle').textContent='数据加载失败，请刷新页面'});
    function init(){DATA.brands.forEach(b=>{const x=document.createElement('button');x.textContent=b.name;x.dataset.id=b.id;x.onclick=()=>{brandId=b.id;render()};$('#brands').appendChild(x)});for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=m+'月'+(m>7?'（仅目标）':'');$('#month').appendChild(o)}$('#month').value=month;$('#month').onchange=e=>{month=+e.target.value;render()};$('.close').onclick=()=>$('#detail').close();render()}
    function getBrand(){return DATA.brands.find(b=>b.id===brandId)}function point(c,m=month){return c.months.find(x=>x.month===m)||null}
    function render(){const b=getBrand();document.querySelectorAll('#brands button').forEach(x=>x.classList.toggle('active',x.dataset.id===brandId));$('#subtitle').textContent=`${b.name} · 2026年${month}月 · 销售收入`;const rows=b.channels.map(c=>({c,p:point(c)})),ok=rows.filter(x=>x.c.data_state==='COMPLETE'&&x.p?.target!=null&&x.p?.actual!=null),t=ok.reduce((s,x)=>s+x.p.target,0),a=ok.reduce((s,x)=>s+x.p.actual,0),r=t?a/t:null,hit=ok.filter(x=>x.p.completion_rate>=1).length;$('#coverage').textContent=`完整可比口径：${ok.length} 个渠道`;$('#target').textContent=compact(t);$('#actual').textContent=compact(a);$('#rate').textContent=pct(r);$('#gap').textContent=r==null?'所选月份暂无实际':`目标差额 ${compact(t-a)}`;$('#achieved').textContent=`${hit} / ${ok.length}`;$('#band-rate').textContent=pct(r);$('#band-bar').style.width=`${Math.min((r||0)*100,100)}%`;$('#band-gap').textContent=r==null?'等待实际数据':`差额 ${money(t-a)}`;renderChart(b);renderRows(rows,b)}
    function renderChart(b){const el=$('#chart');el.innerHTML='';const vals=[];for(let m=1;m<=12;m++){const ps=b.channels.filter(c=>c.data_state==='COMPLETE').map(c=>point(c,m));vals.push({m,t:ps.reduce((s,p)=>s+(p?.target||0),0),a:ps.reduce((s,p)=>s+(p?.actual||0),0)})}const max=Math.max(...vals.flatMap(x=>[x.t,x.a]),1);vals.forEach(x=>{const btn=document.createElement('button');btn.className='month'+(x.m===month?' on':'');btn.title=`${x.m}月 目标 ${money(x.t)} / 实际 ${x.a?money(x.a):'暂无'}`;btn.innerHTML=`<span class="bars"><i class="t" style="height:${Math.max(x.t/max*100,2)}%"></i><i class="a" style="height:${x.a?Math.max(x.a/max*100,2):0}%"></i></span><b>${x.m}月</b>`;btn.onclick=()=>{month=x.m;$('#month').value=month;render()};el.appendChild(btn)})}
    function badge(c,r){if(c.data_state==='NO_DATA')return'<span class="badge muted">暂无数据</span>';if(c.data_state==='TARGET_ONLY')return'<span class="badge info">仅有目标</span>';if(c.data_state==='PARTIAL_TARGET')return'<span class="badge risk">⚠ 口径不完整</span>';return `<span class="badge ${r>=1?'good':'risk'}">${r>=1?'↗ 已达成':'↘ 未达成'}</span>`}
    function renderRows(rows,b){const el=$('#rows');el.innerHTML='';rows.forEach(({c,p})=>{const r=p?.completion_rate??null,g=p?.gap??null,good=r!=null&&r>=1,tr=document.createElement('tr');tr.className='data';tr.innerHTML=`<td><span class="channel"><i>${c.name[0]}</i><span><b>${c.name}</b><small>${c.note}</small></span></span></td><td class="num">${money(p?.target)}</td><td class="num"><b>${money(p?.actual)}</b></td><td>${r==null?'<span style="color:#94a3b8">不可计算</span>':`<span class="progress"><span class="mini"><i style="width:${Math.min(r*100,100)}%;background:${good?'#14b8a6':'#f59e0b'}"></i></span><span class="pct">${pct(r)}</span></span>`}</td><td class="num" style="color:${g==null?'#94a3b8':good?'#0f766e':'#a16207'}">${g==null?'—':(good?'+':'−')+money(Math.abs(g))}</td><td class="num">${badge(c,r)}</td>`;tr.onclick=()=>show(b,c,p);el.appendChild(tr)})}
    function show(b,c,p){$('#d-title').textContent=`${b.name} · ${c.name}`;$('#d-sub').textContent=`2026年${month}月销售口径与来源`;$('#d-target').textContent=money(p?.target);$('#d-actual').textContent=money(p?.actual);$('#d-rate').textContent=pct(p?.completion_rate);$('#d-state').textContent=c.data_state_name;const src=p?[...p.target_sources,...p.actual_sources]:[];$('#d-sources').innerHTML=src.length?src.map(s=>`<div><dt>${s.label}</dt><dd>${s.workbook}<br>${s.sheet}!${s.cell}</dd></div>`).join(''):'<div><dt>说明</dt><dd>暂无可确认来源</dd></div>';$('#d-note').textContent=c.note;$('#detail').showModal()}
  </script>
</body></html>
